#
# Palmier Pro for Linux -- appimage-builder recipe.
# Copyright (C) 2024 Palmier, Inc. and contributors
#
# Produces a relocatable AppImage that bundles the runtime dependencies (Qt 6,
# FFmpeg/libav*, the Vulkan loader, shaderc, libva, lcms2, and libsecret) so the
# editor launches on any supported x86-64 host (glibc >= 2.31) without those
# libraries pre-installed.
#
# Build with:  appimage-builder --recipe packaging/appimage/AppImageBuilder.yml
# (Populate AppDir first, e.g. `cmake --install build --prefix AppDir/usr`.)

version: 1

AppDir:
  path: ./AppDir

  app_info:
    id: io.palmier.PalmierPro
    name: Palmier Pro
    icon: io.palmier.PalmierPro
    version: 0.1.0
    # Entry point relative to AppDir; must be executable.
    exec: usr/bin/palmier-pro
    exec_args: $@

  # Bundle the runtime shared libraries. Base OS is a broadly-compatible
  # distribution so the resulting AppImage runs on glibc >= 2.31 hosts.
  apt:
    arch: amd64
    sources:
      - sourceline: 'deb http://archive.ubuntu.com/ubuntu/ jammy main universe'
    include:
      # Qt 6 UI stack.
      - libqt6core6
      - libqt6gui6
      - libqt6widgets6
      - libqt6quick6
      - libqt6qml6
      # FFmpeg / libav* media engine.
      - libavcodec58
      - libavformat58
      - libavutil56
      - libswscale5
      - libswresample3
      # Vulkan loader + GPU / hardware codec bridge.
      - libvulkan1
      - libva2
      - libva-drm2
      - libva-x11-2
      # SPIR-V effect kernel compilation.
      - libshaderc1
      # Color management + secure credential storage.
      - liblcms2-2
      - libsecret-1-0
    exclude:
      - humanity-icon-theme
      - adwaita-icon-theme

  files:
    exclude:
      - usr/share/man
      - usr/share/doc/*/README.*
      - usr/lib/x86_64-linux-gnu/gconv

  runtime:
    env:
      # Ensure bundled Qt plugins and Vulkan ICDs are discoverable.
      QT_PLUGIN_PATH: '$APPDIR/usr/lib/x86_64-linux-gnu/qt6/plugins'
      QML2_IMPORT_PATH: '$APPDIR/usr/lib/x86_64-linux-gnu/qt6/qml'

  test:
    fedora-30:
      image: appimagecrafters/tests-env:fedora-30
      command: ./AppRun --version
    debian-stable:
      image: appimagecrafters/tests-env:debian-stable
      command: ./AppRun --version

AppImage:
  arch: x86_64
  update-information: 'gh-releases-zsync|palmier-io|palmier-pro|latest|Palmier_Pro-*x86_64.AppImage.zsync'
  # AppImages embed the GPLv3 binaries; the full license ships in the AppDir.
  comp: xz
